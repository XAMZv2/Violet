
name: Android Build (Violet APK)

on:
  push:
    branches: [main, arena/*]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android 36 SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Resolve Gradle Version
        id: gv
        run: |
          VERSION=$(grep -oP 'gradle-\K[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' \
            gradle/wrapper/gradle-wrapper.properties)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle ${{ steps.gv.outputs.version }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}
          cache-read-only: false

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --console=plain --stacktrace --no-daemon \
            2>&1 | tee build-debug.log

      - name: Report Debug Build Errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Build DEBUG gagal — ringkasan error'
            echo '```'
            if [ -f build-debug.log ]; then
              grep -E "^e: |error:|Unresolved|FAILED$" \
                build-debug.log | head -n 100 || true
              echo '---- tail log ----'
              tail -n 40 build-debug.log
            else
              echo "Log build belum tersedia."
            fi
            echo '```'
          } > report.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@report.md || true

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: violet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease \
            --console=plain --stacktrace --no-daemon \
            2>&1 | tee build-release.log

      - name: Report Release Build Errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Build RELEASE gagal — ringkasan error'
            echo '```'
            if [ -f build-release.log ]; then
              grep -E "^e: |error:|Unresolved|FAILED|Missing class|Warning" \
                build-release.log | head -n 120 || true
              echo '---- tail log ----'
              tail -n 60 build-release.log
            else
              echo "Log build belum tersedia."
            fi
            echo '```'
          } > report.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@report.md || true

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: violet-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
