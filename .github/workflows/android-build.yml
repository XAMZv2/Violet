
name: Android Build (Violet APK)

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Violet APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Jangan gunakan input packages di setup-android.
      # Paket SDK dipasang satu per satu pada langkah berikutnya.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --version

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --list_installed

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          grep 'distributionUrl=' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        id: debug
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleDebug \
            --console=plain \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build-debug.log

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: violet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        id: release
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleRelease \
            --console=plain \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build-release.log

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: violet-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          echo "Build Violet gagal."
          echo "Periksa log pada langkah yang ditandai merah."

          if [ -f build-debug.log ]; then
            echo "===== DEBUG LOG ====="
            tail -n 100 build-debug.log
          fi

          if [ -f build-release.log ]; then
            echo "===== RELEASE LOG ====="
            tail -n 100 build-release.log
          fi
