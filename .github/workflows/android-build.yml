
name: Build Violet APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Violet APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan: $SDKMANAGER"
            find "$ANDROID_HOME" -name sdkmanager -type f || true
            exit 1
          fi

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          python3 -c '
          import subprocess
          import sys

          result = subprocess.run(
              [sys.argv[1], "--licenses"],
              input="y\n" * 200,
              text=True
          )
          sys.exit(result.returncode)
          ' "$SDKMANAGER"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android SDK siap digunakan."

           - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle Wrapper JAR tidak ada di repo."
            echo "Mengunduh JAR resmi Gradle Wrapper..."

            mkdir -p gradle/wrapper
            curl -fL --retry 3 \
              https://raw.githubusercontent.com/gradle/gradle/v9.6.1/gradle/wrapper/gradle-wrapper.jar \
              -o gradle/wrapper/gradle-wrapper.jar
          fi

          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

          echo "Gradle Wrapper siap."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee build-debug.log

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: violet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee build-release.log

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: violet-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show build logs on failure
        if: failure()
        shell: bash
        run: |
          for file in build-debug.log build-release.log; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              tail -n 120 "$file"
            fi
          done
